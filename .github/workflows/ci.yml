name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose --profile test run --build --rm test-runner
      - run: docker compose exec -T api python scripts/smoke.py
      - run: docker compose exec -T api python scripts/simulator_smoke.py
      - run: docker compose exec -T api python scripts/recovery_smoke.py
      - run: docker compose run --rm migrate
      - run: docker compose --profile test down && docker compose up --wait --wait-timeout 180
      - run: docker compose exec -T api python scripts/smoke.py
      - run: docker compose exec -T api python scripts/simulator_smoke.py
      - run: docker compose exec -T api python scripts/recovery_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose --profile test down --volumes
