[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payrevive"
version = "0.1.0"
description = "Simulation-first payment intelligence and revenue recovery"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
]

[dependency-groups]
analysis = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "pandas>=2.2,<4",
]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "simulator", "ml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "simulator/tests", "ml/tests"]
addopts = "-m 'not postgres'"
markers = ["postgres: real isolated PostgreSQL integration tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
