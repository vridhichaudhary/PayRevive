name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m experiments.report --config experiments/smoke.json --output work/experiment-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-experiment-smoke
          path: work/experiment-smoke/
          if-no-files-found: error
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose --profile test run --build --rm test-runner
      - run: docker compose exec -T api python scripts/smoke.py
      - run: docker compose exec -T api python scripts/simulator_smoke.py
      - run: docker compose exec -T api python scripts/features_smoke.py
      - run: docker compose exec -T api python scripts/recovery_smoke.py
      - run: docker compose exec -T api python -m scripts.demo_seed
      - run: docker compose exec -T api python -m scripts.dashboard_smoke
      - name: Ensure serving image excludes notebook tooling
        run: >-
          docker compose exec -T api python -c
          "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ['nbclient', 'nbconvert', 'ipykernel', 'jupyterlab', 'pandas', 'sklearn', 'shap'])"
      - run: docker compose run --rm migrate
      - run: docker compose --profile test down && docker compose up --wait --wait-timeout 180
      - run: docker compose exec -T api python scripts/smoke.py
      - run: docker compose exec -T api python scripts/simulator_smoke.py
      - run: docker compose exec -T api python scripts/features_smoke.py
      - run: docker compose exec -T api python scripts/recovery_smoke.py
      - run: docker compose exec -T api python -m scripts.demo_seed
      - run: docker compose exec -T api python -m scripts.dashboard_smoke
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose --profile test down --volumes

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --group analysis
      - run: uv run --group analysis pytest -m analysis -q -W error
      - run: uv run --group analysis python -m simulator.run --customers 300 --output work/notebook-input
      - run: uv run --group analysis python -m ml.notebooks.run --dataset work/notebook-input --output work/notebook-report
      - uses: actions/upload-artifact@v4
        with:
          name: data-audit-notebook
          path: work/notebook-report/
          if-no-files-found: error
      - run: >-
          uv run --group analysis python -m ml.notebooks.run
          --notebook notebooks/02_degradation_detection.ipynb
          --dataset work/notebook-input --output work/detection-report
      - uses: actions/upload-artifact@v4
        with:
          name: degradation-detection-notebook
          path: work/detection-report/
          if-no-files-found: error
      - run: >-
          uv run --group analysis python -m ml.notebooks.run
          --notebook notebooks/03_failure_diagnosis.ipynb
          --dataset work/notebook-input --output work/diagnosis-report
      - uses: actions/upload-artifact@v4
        with:
          name: failure-diagnosis-notebook
          path: work/diagnosis-report/
          if-no-files-found: error
